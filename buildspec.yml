version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm install -g pnpm
      - pnpm install --frozen-lockfile

  build:
    commands:
      - pnpm build

  post_build:
    commands:
      # HTML — sin cache para que las invalidaciones de CF sean inmediatas
      - |
        aws s3 sync dist/ s3://blog-vitau/ \
          --delete \
          --exclude "*" \
          --include "*.html" \
          --cache-control "public,max-age=0,must-revalidate" \
          --content-type "text/html; charset=utf-8"
      # Assets con hash en nombre (blog/_astro/) — cache largo, son inmutables
      - |
        aws s3 sync dist/blog/_astro/ s3://blog-vitau/blog/_astro/ \
          --delete \
          --cache-control "public,max-age=31536000,immutable"
      # Imágenes del blog (descargadas de Notion en build time) — cache inmutable
      - |
        if [ -d dist/blog/images ] && [ "$(ls -A dist/blog/images)" ]; then
          aws s3 sync dist/blog/images/ s3://blog-vitau/blog/images/ \
            --cache-control "public,max-age=31536000,immutable"
        fi
      # Resto de assets (fuentes, robots.txt, etc.)
      - |
        aws s3 sync dist/ s3://blog-vitau/ \
          --delete \
          --exclude "*.html" \
          --exclude "blog/_astro/*" \
          --exclude "blog/images/*" \
          --cache-control "public,max-age=86400"
      # Copiar 404.html al path de blog para el custom error response de CF
      - |
        aws s3 cp s3://blog-vitau/404.html s3://blog-vitau/blog/404.html \
          --cache-control "public,max-age=0,must-revalidate" \
          --content-type "text/html; charset=utf-8"
      # Invalidar rutas del blog y ayuda en CF
      - |
        aws cloudfront create-invalidation \
          --distribution-id E2UVOB18PP0Q47 \
          --paths "/blog/*" "/ayuda/*"
